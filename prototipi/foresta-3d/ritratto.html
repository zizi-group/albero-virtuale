<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Linfa — ritratto con sfondo trasparente</title>
  <style>
    /* scacchiera solo per vedere la trasparenza: non finisce nel PNG */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: repeating-conic-gradient(#d9d9d9 0 25%, #f2f2f2 0 50%) 0 0 / 24px 24px; font-family: system-ui, sans-serif; }
    canvas { max-width: 92vw; max-height: 86vh; width: auto !important; height: auto !important; }
    a { position: fixed; left: 14px; bottom: 12px; color: #234; font-size: 13px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <a id="scarica" download="linfa-ritratto.png">Scarica il PNG</a>
  <script type="module">
    // Ritratto di Linfa per la landing: PNG con sfondo trasparente.
    // Parametri: ?seme=…&specie=…&strada=… (senza parametri: la Linfa della radura).
    // ?fila: i sette alberi di varianti.html uno accanto all'altro.
    import * as THREE from "three";
    import { creaLinfa } from "./linfa.js";
    import { FILA } from "./fila.js";

    const P = new URLSearchParams(location.search);
    const FILA_MODO = P.has("fila");
    const W = FILA_MODO ? 2800 : 1200, H = FILA_MODO ? (P.has("visi") ? 640 : 1000) : 1500;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    document.body.prepend(renderer.domElement);

    const scena = new THREE.Scene();
    // Luce da studio, calda come nella radura, con controluce
    scena.add(new THREE.HemisphereLight("#cfe3c6", "#4a3a22", 1.1));
    const chiave = new THREE.DirectionalLight("#ffd29a", 3.0);
    chiave.position.set(-4, 5, 6);
    const contro = new THREE.DirectionalLight("#ffcf80", 2.4);
    contro.position.set(3, 4, -6);
    const riempi = new THREE.DirectionalLight("#cfe0ff", 0.6);
    riempi.position.set(5, 1, 5);
    scena.add(chiave, contro, riempi);

    const opzioni = P.has("seme") || P.has("specie") || P.has("strada")
      ? Object.fromEntries([...P].filter(([k]) => ["seme", "specie", "strada"].includes(k)))
      : { seme: "linfa", specie: "quercia", strada: "nessuna", viso: "puntini", sopracciglia: "piccole", bocca: "sorriso", lentiggini: false, tono: 0.55, altezza: 1, larghezza: 1 };
    const elenco = FILA_MODO ? FILA : [opzioni];
    const tutti = new THREE.Group();
    elenco.forEach((o, i) => {
      const l = creaLinfa(o);
      l.gruppo.position.x = (i - (elenco.length - 1) / 2) * 2.5;
      l.gruppo.rotation.y = FILA_MODO ? 0 : -0.18;
      l.aggiorna(0.4 + i * 0.7, 0.016);
      tutti.add(l.gruppo);
    });
    scena.add(tutti);

    // Inquadra tutto l'albero
    const box = new THREE.Box3().setFromObject(tutti);
    const centro = box.getCenter(new THREE.Vector3()), dim = box.getSize(new THREE.Vector3());
    const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 50);

    const dist = Math.max((dim.y * 0.56) / Math.tan(THREE.MathUtils.degToRad(12)), (dim.x * 0.53) / (Math.tan(THREE.MathUtils.degToRad(12)) * (W / H)));
    camera.position.set(centro.x + (FILA_MODO ? 0 : dist * 0.12), centro.y + dist * 0.18, centro.z + dist);
    camera.lookAt(centro.x, centro.y - dim.y * 0.02, centro.z);
    if (P.has("visi")) {
      // ?fila&visi: un riquadro per albero, inquadrato sul viso
      const n = elenco.length, w = W / n;
      const cv = new THREE.PerspectiveCamera(24, w / H, 0.1, 50);
      renderer.setScissorTest(true);
      tutti.children.forEach((g, i) => {
        cv.position.set(g.position.x, 1.35, 4.6);
        cv.lookAt(g.position.x, 1.2, 0);
        renderer.setViewport(i * w, 0, w, H);
        renderer.setScissor(i * w, 0, w, H);
        renderer.render(scena, cv);
      });
      renderer.setScissorTest(false);
    } else renderer.render(scena, camera);

    const a = document.getElementById("scarica");
    a.href = renderer.domElement.toDataURL("image/png");
    if (FILA_MODO) a.download = "linfa-sette-alberi.png";
    else if (P.has("strada")) a.download = `linfa-ritratto-${P.get("strada")}.png`;
    window.__salva = async (nome) => (await fetch(`/salva?nome=${encodeURIComponent(nome)}`, { method: "POST", body: renderer.domElement.toDataURL("image/png") })).status;
    window.__pronto = true;
  </script>
</body>
</html>
